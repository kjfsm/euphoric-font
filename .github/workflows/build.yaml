name: Build font and specimen

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master # for backwards compatibility; use your default branch if different
    tags:
      - "*"

permissions: write-all

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cargo-bins/cargo-binstall@main
        name: Install cargo binstall
      - name: Install Rust font tools
        run: |
          cargo binstall --no-confirm diffenator3
      - name: Install toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
          sudo snap install yq
      - uses: actions/cache@v5
        with:
          path: ./venv/
          key: ${{ runner.os }}-venv${{ steps.python.outputs.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv${{ steps.python.outputs.python-version }}-
      - name: Set artifact file name
        id: zip-name
        shell: bash
        # Set the archive name to repo name + "-fonts" e.g "radiocanadafonts-fonts.zip"
        run: echo "ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-fonts" >> $GITHUB_ENV

      # If a new release is cut, use the release tag to auto-bump the source files
      # - name: Bump release
      #   if: github.event_name == 'release'
      #   run: |
      #     . venv/bin/activate
      #     SRCS=$(yq e ".sources[]" sources/config.yaml)
      #     TAG_NAME=${GITHUB_REF/refs\/tags\//}
      #     echo "Bumping $SRCS to $TAG_NAME"
      #     for src in $SRCS
      #     do
      #       bumpfontversion sources/$src --new-version $TAG_NAME;
      #     done

      - name: Build font
        run: make build
      # リリースするかどうかは、sources/config.yaml を別の方法で読み直すのではなく、
      # できたフォントの版で決める。
      - name: Decide release
        id: release
        run: |
          . venv/bin/activate
          VERSION=$(python3 -c 'import glob; from fontTools.ttLib import TTFont; print("%.3f" % TTFont(glob.glob("fonts/ttf/*.ttf")[0])["head"].fontRevision)')
          if [ "${{ github.ref_type }}" = tag ]; then
            if [ "$VERSION" != "${{ github.ref_name }}" ]; then
              echo "::error file=sources/config.yaml::タグ ${{ github.ref_name }} とフォントの版 $VERSION が一致しない"
              exit 1
            fi
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            # 版を上げてマージしたときだけリリースする。その版のタグがもうあれば何もしない。
            if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check with fontspector
        run: make test
        continue-on-error: true
      - name: Generate proofs
        run: make proof
      - name: Archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            fonts
            out
    outputs:
      zip_name: ${{ env.ZIP_NAME }}
      release_tag: ${{ steps.release.outputs.tag }}

  # テンプレートは検査レポートを GitHub Pages に置くが、ここではフォントと一緒に
  # fonts.euphoric.band(Cloudflare Workers)で配る。
  deploy:
    name: Deploy to Cloudflare Workers
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use font artifacts from CI
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.zip_name }}
      - name: Collect files to serve
        run: sh scripts/build-site.sh
      - name: Deploy
        run: npx --yes wrangler@4.131.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # There are two ways a release can be created: either by pushing a tag, or by
  # creating a release from the GitHub UI. Pushing a tag does not automatically
  # create a release, so we have to do that ourselves. However, creating a
  # release from the GitHub UI *does* push a tag, and we don't want to create
  # a new release in that case because one already exists!
  #
  # このリポジトリでは3つ目として、版を上げて main にマージしたときにも作る。
  # GITHUB_TOKEN で push したタグでは別のワークフローが起動しないので、タグは
  # 下の gh release create がこのジョブの中で作る。

  release:
    name: Release bundle
    if: ${{ needs.build.outputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      TAG: ${{ needs.build.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Use font artifacts from CI
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
      - name: Copy ARTICLE.en_us.html to release directory
        run: cp documentation/ARTICLE.en_us.html ${{ env.ZIP_NAME }}/ARTICLE.en_us.html
        continue-on-error: true
      - name: Copy OFL.txt to release directory
        run: cp OFL.txt ${{ env.ZIP_NAME }}/OFL.txt
      - name: Remove proof/test outputs from release
        run: rm -rf ${{ env.ZIP_NAME }}/out
      - name: Set release file name
        shell: bash
        run: echo "RELEASE_ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-$TAG" >> $GITHUB_ENV
      - name: Create release bundle
        run: mv ${{ env.ZIP_NAME }} ${{ env.RELEASE_ZIP_NAME }}; zip -r ${{ env.RELEASE_ZIP_NAME }}.zip ${{ env.RELEASE_ZIP_NAME }}
      - name: Check for release
        id: create_release
        run: |
          if ! gh release view "$TAG"; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
      - name: Populate release
        run: |
          gh release upload "$TAG" ${{ env.RELEASE_ZIP_NAME }}.zip --clobber
      - name: Set release live
        run: |
          gh release edit "$TAG" --draft=false
